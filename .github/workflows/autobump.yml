name: autobump

on:
  schedule:
    - cron: "17 * * * *"   # 请求每小时 :17 (UTC)；macOS runner 实测每天只触发 4~6 次，会延后
  workflow_dispatch:       # manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  bump:
    runs-on: macos-latest   # 重打包依赖 hdiutil/ditto/codesign，必须用 macOS runner
    env:
      # bump-*.sh 通过该 SSH 别名把重打的 zip 上传到 ACS（别名在下方 SSH 配置步骤写入 ~/.ssh/config）
      ACS_HOST: acs-host
    steps:
      - uses: actions/checkout@v4

      # 配置到 ACS 的免密 SSH（仅重打包型 cask 需要：iqiyi）。
      # 私钥放在仓库 Secret ACS_SSH_KEY，绝不入库；公钥需提前加入 ACS 的 authorized_keys。
      # 未配置该 Secret 的 fork 上会安全跳过，不影响其余直链 cask。
      - name: Configure SSH to ACS
        env:
          ACS_SSH_KEY: ${{ secrets.ACS_SSH_KEY }}
        run: |
          if [ -z "$ACS_SSH_KEY" ]; then echo "ACS_SSH_KEY 未配置，重打包型 cask 将跳过"; exit 0; fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$ACS_SSH_KEY" > ~/.ssh/id_ed25519_ci
          chmod 600 ~/.ssh/id_ed25519_ci
          ssh-keyscan -H -t ed25519,rsa 8.130.151.172 >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<'EOF'
          Host acs-host
            HostName 8.130.151.172
            User root
            IdentityFile ~/.ssh/id_ed25519_ci
            IdentitiesOnly yes
          EOF
          chmod 600 ~/.ssh/config
          ssh acs-host 'echo "ACS SSH 连通: $(hostname)"'

      # 各 cask 独立 bump，单个失败（上游页面变化、网络封锁等）不阻塞其余。
      # run-bump.sh 自身恒返回 0 以保持隔离，同时把每个 cask 的结论记入汇总表，
      # 由末尾 finish-bump.sh 让失败可见（job 变红），不再静默跳过。
      # 重打包型（iqiyi）用 NO_COMMIT=1，交给统一步骤提交。
      - name: Bump iqiyi
        env:
          NO_COMMIT: "1"
          ACS_DIR: /srv/refill/iqiyi
        run: bash scripts/run-bump.sh iqiyi bash scripts/bump-iqiyi.sh Casks/iqiyi.rb

      - name: Bump qoder
        run: bash scripts/run-bump.sh qoder bash scripts/bump-qoder.sh Casks/qoder.rb

      - name: Bump qoder-cn
        run: bash scripts/run-bump.sh qoder-cn bash scripts/bump-qoder-cn.sh Casks/qoder-cn.rb

      - name: Bump qoder-ide
        run: bash scripts/run-bump.sh qoder-ide bash scripts/bump-qoder-ide.sh Casks/qoder-ide.rb

      - name: Bump workbuddy
        run: bash scripts/run-bump.sh workbuddy bash scripts/bump-workbuddy.sh Casks/workbuddy.rb

      - name: Bump buhocleaner
        run: bash scripts/run-bump.sh buhocleaner bash scripts/bump-buhocleaner.sh Casks/buhocleaner.rb

      - name: Bump deepseek-harness
        run: bash scripts/run-bump.sh deepseek-harness bash scripts/bump-deepseek-harness.sh Casks/deepseek-harness.rb

      - name: Commit & push if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -am "autobump casks to latest"
            git push
          else
            echo "no changes to commit"
          fi

      # 放在提交之后：即使某个 cask 检测失败，其余已升级的 cask 也已正常发布。
      - name: Finish (summary + fail if any cask broke)
        run: bash scripts/finish-bump.sh
