name: autobump

on:
  schedule:
    - cron: "*/15 * * * *"   # 每 15 分钟；Linux runner 排队短，实际接近准点
  workflow_dispatch:         # manual trigger from the Actions tab

permissions:
  contents: write

# 与 autobump-iqiyi 共用同一 concurrency group，避免两个 workflow 同时 push 冲突。
concurrency:
  group: refill-autobump
  cancel-in-progress: false

jobs:
  bump:
    # 轻量直链型 cask 只需要 curl / python3 / ssh，Linux runner 即可，
    # 且排队远短于 macOS。iqiyi 依赖 hdiutil/ditto/codesign，单独在
    # autobump-iqiyi.yml 的 macOS runner 上跑。
    #
    # arczip / workbuddy 的上游数据经 ACS 国内出口获取（见 scripts/upstream.sh）：
    # 境外 runner 直连 download.arczip.app 会被 Cloudflare 403，且 /v2/update
    # 对境外返回旧渠道版本。未配置 Secret 的 fork 自动退回直连。
    runs-on: ubuntu-latest
    env:
      ACS_HOST: acs-host
    steps:
      - uses: actions/checkout@v4

      # 配置到 ACS 的免密 SSH（与 autobump-iqiyi.yml 相同）。
      # 私钥放在仓库 Secret ACS_SSH_KEY，绝不入库；公钥需提前加入 ACS 的 authorized_keys。
      - name: Configure SSH to ACS
        env:
          ACS_SSH_KEY: ${{ secrets.ACS_SSH_KEY }}
        run: |
          if [ -z "$ACS_SSH_KEY" ]; then echo "ACS_SSH_KEY 未配置，上游取数将退回直连"; exit 0; fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$ACS_SSH_KEY" > ~/.ssh/id_ed25519_ci
          chmod 600 ~/.ssh/id_ed25519_ci
          ssh-keyscan -H -t ed25519,rsa 8.130.151.172 >> ~/.ssh/known_hosts 2>/dev/null
          cat > ~/.ssh/config <<'EOF'
          Host acs-host
            HostName 8.130.151.172
            User root
            IdentityFile ~/.ssh/id_ed25519_ci
            IdentitiesOnly yes
          EOF
          chmod 600 ~/.ssh/config
          ssh acs-host 'echo "ACS SSH 连通: $(hostname)"'

      # shasum 由 perl 提供；ubuntu-latest 通常自带，缺失时补装。
      - name: Ensure shasum
        run: command -v shasum >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y libdigest-sha-perl; }

      # 各 cask 独立 bump，单个失败不阻塞其余（run-bump.sh 恒返回 0）。
      # 每个 step 设 timeout-minutes 防卡死；Commit/Finish 用 if: always() 兜底。
      - name: Bump qoder
        timeout-minutes: 25
        run: bash scripts/run-bump.sh qoder bash scripts/bump-qoder.sh Casks/qoder.rb

      - name: Bump qoder-cn
        timeout-minutes: 25
        run: bash scripts/run-bump.sh qoder-cn bash scripts/bump-qoder-cn.sh Casks/qoder-cn.rb

      - name: Bump qoder-ide
        timeout-minutes: 25
        run: bash scripts/run-bump.sh qoder-ide bash scripts/bump-qoder-ide.sh Casks/qoder-ide.rb

      - name: Bump workbuddy
        timeout-minutes: 25
        run: bash scripts/run-bump.sh workbuddy bash scripts/bump-workbuddy.sh Casks/workbuddy.rb

      - name: Bump buhocleaner
        timeout-minutes: 25
        run: bash scripts/run-bump.sh buhocleaner bash scripts/bump-buhocleaner.sh Casks/buhocleaner.rb

      - name: Bump arczip
        timeout-minutes: 25
        run: bash scripts/run-bump.sh arczip bash scripts/bump-arczip.sh Casks/arczip.rb

      - name: Bump deepseek-harness
        timeout-minutes: 25
        run: bash scripts/run-bump.sh deepseek-harness bash scripts/bump-deepseek-harness.sh Casks/deepseek-harness.rb

      # if: always()：即使前面某个 bump step 超时/失败，也要提交已完成的升级。
      - name: Commit & push if changed
        if: always()
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -am "autobump casks to latest"
            git pull --rebase || true
            git push
          else
            echo "no changes to commit"
          fi

      - name: Finish (summary + fail if any cask broke)
        if: always()
        env:
          EXPECTED_CASKS: "qoder qoder-cn qoder-ide workbuddy buhocleaner arczip deepseek-harness"
        run: bash scripts/finish-bump.sh
