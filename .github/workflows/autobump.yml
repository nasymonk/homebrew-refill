name: autobump

on:
  schedule:
    - cron: "17 * * * *"   # every hour, at :17 (UTC)
  workflow_dispatch:       # manual trigger from the Actions tab

permissions:
  contents: write

jobs:
  bump:
    runs-on: macos-latest   # bump 脚本依赖 hdiutil/plutil/unzip
    steps:
      - uses: actions/checkout@v4

      # 各 cask 独立 bump，单个失败（如上游页面结构变化、网络封锁）不阻塞其余
      - name: Bump iqiyi
        run: bash scripts/bump-iqiyi.sh Casks/iqiyi.rb
        continue-on-error: true

      - name: Bump qoder
        run: bash scripts/bump-qoder.sh Casks/qoder.rb
        continue-on-error: true

      - name: Bump qoder-cn
        run: bash scripts/bump-qoder-cn.sh Casks/qoder-cn.rb
        continue-on-error: true

      - name: Bump qoder-ide
        run: bash scripts/bump-qoder-ide.sh Casks/qoder-ide.rb
        continue-on-error: true

      - name: Bump workbuddy
        run: bash scripts/bump-workbuddy.sh Casks/workbuddy.rb
        continue-on-error: true

      - name: Bump buhocleaner
        run: bash scripts/bump-buhocleaner.sh Casks/buhocleaner.rb
        continue-on-error: true

      - name: Commit & push if changed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -am "autobump casks to latest"
            git push
          else
            echo "no changes to commit"
          fi
