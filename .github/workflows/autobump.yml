name: autobump

on:
  schedule:
    - cron: "*/15 * * * *"   # 每 15 分钟；Linux runner 排队短，实际接近准点
  workflow_dispatch:         # manual trigger from the Actions tab

permissions:
  contents: write

# 与 autobump-iqiyi 共用同一 concurrency group，避免两个 workflow 同时 push 冲突。
concurrency:
  group: refill-autobump
  cancel-in-progress: false

jobs:
  bump:
    # 轻量直链型 cask 只需要 curl / python3 / unzip / shasum，Linux runner 即可，
    # 且排队远短于 macOS。iqiyi 依赖 hdiutil/ditto/codesign，单独在
    # autobump-iqiyi.yml 的 macOS runner 上跑。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # shasum 由 perl 提供；ubuntu-latest 通常自带，缺失时补装。
      - name: Ensure shasum
        run: command -v shasum >/dev/null 2>&1 || { sudo apt-get update && sudo apt-get install -y libdigest-sha-perl; }

      # 各 cask 独立 bump，单个失败不阻塞其余（run-bump.sh 恒返回 0）。
      # 每个 step 设 timeout-minutes 防卡死；Commit/Finish 用 if: always() 兜底。
      - name: Bump qoder
        timeout-minutes: 25
        run: bash scripts/run-bump.sh qoder bash scripts/bump-qoder.sh Casks/qoder.rb

      - name: Bump qoder-cn
        timeout-minutes: 25
        run: bash scripts/run-bump.sh qoder-cn bash scripts/bump-qoder-cn.sh Casks/qoder-cn.rb

      - name: Bump qoder-ide
        timeout-minutes: 25
        run: bash scripts/run-bump.sh qoder-ide bash scripts/bump-qoder-ide.sh Casks/qoder-ide.rb

      - name: Bump workbuddy
        timeout-minutes: 25
        run: bash scripts/run-bump.sh workbuddy bash scripts/bump-workbuddy.sh Casks/workbuddy.rb

      - name: Bump buhocleaner
        timeout-minutes: 25
        run: bash scripts/run-bump.sh buhocleaner bash scripts/bump-buhocleaner.sh Casks/buhocleaner.rb

      - name: Bump arczip
        timeout-minutes: 25
        run: bash scripts/run-bump.sh arczip bash scripts/bump-arczip.sh Casks/arczip.rb

      - name: Bump deepseek-harness
        timeout-minutes: 25
        run: bash scripts/run-bump.sh deepseek-harness bash scripts/bump-deepseek-harness.sh Casks/deepseek-harness.rb

      # if: always()：即使前面某个 bump step 超时/失败，也要提交已完成的升级。
      - name: Commit & push if changed
        if: always()
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit -am "autobump casks to latest"
            git pull --rebase || true
            git push
          else
            echo "no changes to commit"
          fi

      - name: Finish (summary + fail if any cask broke)
        if: always()
        env:
          EXPECTED_CASKS: "qoder qoder-cn qoder-ide workbuddy buhocleaner arczip deepseek-harness"
        run: bash scripts/finish-bump.sh
