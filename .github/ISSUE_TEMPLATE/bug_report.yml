name: 🐛 故障与问题反馈
description: 反馈软件安装失败、版本未自动更新、SHA256 校验错误、下载失效等问题
title: "[问题] <软件名称> - <问题简述>"
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈问题！请先运行 `brew update && brew upgrade` 确保本地 Tap 已同步最新提交。

  - type: checkboxes
    id: pre-check
    attributes:
      label: 提交前排查
      options:
        - label: 已运行 `brew update` 同步最新的软件定义并重试
          required: true
        - label: 网络连接正常（已确认上游下载链接非因本地代理或 DNS 故障导致无法访问）
          required: true

  - type: input
    id: cask-name
    attributes:
      label: 软件名称
      placeholder: 例如：iqiyi、buhocleaner、aio-coding-hub
    validations:
      required: true

  - type: dropdown
    id: issue-type
    attributes:
      label: 问题类型
      options:
        - 📥 安装或升级执行报错
        - 🔄 版本过旧 / 自动更新未触发
        - 🔐 SHA256 校验不匹配
        - 🚫 上游下载链接 404 或失效
        - 🗑️ 卸载残留清理异常
        - ❓ 其他异常
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: 详细现象与复现过程
      placeholder: 请详细描述遇到的错误现象、预期结果与实际结果
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: 终端输出与错误日志
      description: 请粘贴完整的执行命令及终端输出日志（包含完整的错误堆栈）
      placeholder: |
        $ brew install --cask <软件名> --verbose
        ==> Downloading ...
        Error: Checksum mismatch...
      render: shell
    validations:
      required: false

  - type: input
    id: env-info
    attributes:
      label: 系统与环境信息
      description: macOS 版本、芯片架构及 Homebrew 版本
      placeholder: 例如：macOS 15.3 (M3 Pro 芯片), Homebrew 4.4.x
    validations:
      required: false


